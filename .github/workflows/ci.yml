name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun test
      - name: typecheck
        run: bunx tsc --noEmit
      - name: generate tasks (fallback varp ids)
        run: bun generate-tasks.ts && bun tools/check-generated-tasks.ts
