name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun test
      - name: typecheck (non-blocking until v0.2)
        run: bunx tsc --noEmit
        continue-on-error: true
      - name: generate tasks (fallback varp ids)
        run: bun generate-tasks.ts && test "$(ls tasks | wc -l)" -eq 20
